<div class="max-w-2xl mx-auto mt-6 bg-white shadow-lg rounded-2xl p-6">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">Crear Producto</h1>

  <form (ngSubmit)="guardarProducto()" class="space-y-4">
    
    <div>
      <label class="block text-sm font-medium text-gray-700">Código</label>
      <input type="number" [(ngModel)]="nuevoProducto.codigo" name="codigo" required
        class="w-full mt-1 px-3 py-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Descripción</label>
      <input type="text" [(ngModel)]="nuevoProducto.descripcion" name="descripcion" required
        class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Proveedor</label>
      <input type="text" [(ngModel)]="nuevoProducto.proveedor" name="proveedor" required
        class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Precio Costo</label>
        <input type="number" [(ngModel)]="nuevoProducto.precioCosto" name="precioCosto" required
          class="w-full mt-1 px-3 py-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Precio Venta</label>
        <input type="number" [(ngModel)]="nuevoProducto.precioVenta" name="precioVenta" required
          class="w-full mt-1 px-3 py-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Foto URL</label>
      <input type="text" [(ngModel)]="nuevoProducto.foto" name="foto"
        class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>

    <button type="submit" 
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition">
      Guardar Producto
    </button>
  </form>
</div>
