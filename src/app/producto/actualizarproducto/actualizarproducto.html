<div class="max-w-2xl mx-auto mt-6 bg-white shadow-lg rounded-2xl p-6">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">Actualizar Producto</h1>

  <form (ngSubmit)="actualizarProducto()" class="space-y-4">
    <!-- mismos inputs de arriba -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Código</label>
      <input type="number" [(ngModel)]="producto.codigo" name="codigo" required
        class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg bg-gray-100" readonly>
    </div>

    <!-- copia el resto de inputs igual que en crear pero con [(ngModel)]="producto." -->

    <button type="submit" 
      class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg transition">
      Actualizar Producto
    </button>
  </form>
</div>
