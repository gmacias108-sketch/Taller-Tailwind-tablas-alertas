<p>formulario-proveedor works!</p>
<div class="min-h-screen bg-slate-50 flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 border border-slate-100">
    <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">Registrar Proveedor</h2>
    
    <form (ngSubmit)="guardarProveedor()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nombre del Proveedor</label>
        <input type="text" placeholder="Ej. Comercializadora S.A." name="nombre_proveedor" [(ngModel)]="nombre_proveedor"
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Teléfono</label>
        <input type="text" placeholder="Ej. 3123456789" name="telefono" [(ngModel)]="telefono"
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Dirección</label>
        <input type="text" placeholder="Ej. Calle 5 # 4-20" name="direccion" [(ngModel)]="direccion"
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>

      <button type="submit" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
        Guardar Proveedor
      </button>
    </form>
  </div>
</div>
