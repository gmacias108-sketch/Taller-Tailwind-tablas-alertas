<div class="min-h-screen bg-slate-100 p-8">
  <div class="max-w-6xl mx-auto">
    
    <!-- Alerta visual general o de eliminación -->
    <div *ngIf="alertaVisible" class="mb-6 p-4 rounded-lg bg-emerald-50 border border-emerald-300 text-emerald-800 flex justify-between items-center shadow-sm">
      <span class="font-medium">{{ mensajeAlerta }}</span>
      <button (click)="alertaVisible = false" class="text-emerald-700 hover:text-emerald-900 font-bold text-lg px-2">&times;</button>
    </div>

    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-slate-900">Listado de Proveedores</h1>
      <a routerLink="/proveedores/crear" class="rounded-lg bg-slate-900 px-5 py-2.5 text-white font-medium hover:bg-slate-800 shadow transition">
        + Nuevo Proveedor
      </a>
    </div>

    <div class="bg-white rounded-xl shadow-md overflow-hidden border border-slate-200">
      <table class="w-full border-collapse text-left">
        <thead>
          <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 uppercase text-xs tracking-wider">
            <th class="py-3 px-6">ID</th>
            <th class="py-3 px-6">Nombre</th>
            <th class="py-3 px-6">Teléfono</th>
            <th class="py-3 px-6">Dirección</th>
            <th class="py-3 px-6">NIT</th>
            <th class="py-3 px-6 text-center">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-200 text-slate-700">
          <tr *ngFor="let p of proveedores" class="hover:bg-slate-50 transition">
            <td class="py-4 px-6 font-medium">{{ p.id }}</td>
            <td class="py-4 px-6">{{ p.nombre }}</td>
            <td class="py-4 px-6">{{ p.telefono }}</td>
            <td class="py-4 px-6">{{ p.direccion }}</td>
            <td class="py-4 px-6">{{ p.nit }}</td>
            <td class="py-4 px-6 flex justify-center gap-3">
              <button [routerLink]="['/proveedores/actualizar']" [queryParams]="{id: p.id}" class="rounded-md bg-amber-500 px-3 py-1.5 text-white text-sm font-medium hover:bg-amber-600 transition">
                Actualizar
              </button>
              <button (click)="eliminar(p.id)" class="rounded-md bg-rose-500 px-3 py-1.5 text-white text-sm font-medium hover:bg-rose-600 transition">
                Eliminar
              </button>
            </td>
          </tr>
          <!-- Estado vacío por si no hay registros -->
          <tr *ngIf="proveedores.length === 0">
            <td colspan="6" class="text-center py-8 text-slate-400">No hay proveedores registrados.</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
