<p>listar-proveedor works!</p>
<div class="min-h-screen bg-slate-50 p-8">
  <div class="max-w-4xl mx-auto">
    
    <!-- Alerta -->
    <div *ngIf="showAlert" class="mb-6 p-4 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800 flex items-center justify-between shadow-sm">
      <div class="flex items-center space-x-2">
        <span class="font-bold">Aviso:</span>
        <span>{{ alertMessage }}</span>
      </div>
      <button (click)="cerrarAlerta()" class="text-emerald-600 font-bold hover:text-emerald-900 text-lg">&times;</button>
    </div>

    <!-- Cabecera -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-extrabold text-slate-800">Listado de Proveedores</h1>
      <button routerLink="/formulario-proveedor" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium shadow transition">
        + Nuevo Proveedor
      </button>
    </div>

    <!-- Tabla -->
    <div class="bg-white shadow-md rounded-xl overflow-hidden border border-slate-200">
      <table class="w-full border-collapse text-left">
        <thead class="bg-slate-100 text-slate-600 uppercase text-xs tracking-wider">
          <tr>
            <th class="py-3 px-6">Código</th>
            <th class="py-3 px-6">Nombre Proveedor</th>
            <th class="py-3 px-6">Teléfono</th>
            <th class="py-3 px-6">Dirección</th>
            <th class="py-3 px-6 text-center">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-200 text-slate-700 text-sm">
          <tr *ngFor="let proveedor of proveedores" class="hover:bg-slate-50 transition">
            <td class="py-4 px-6 font-medium text-slate-900">{{ proveedor.codigo_proveedor }}</td>
            <td class="py-4 px-6">{{ proveedor.nombre_proveedor }}</td>
            <td class="py-4 px-6">{{ proveedor.telefono }}</td>
            <td class="py-4 px-6">{{ proveedor.direccion }}</td>
            <td class="py-4 px-6 flex justify-center space-x-2">
              <button (click)="eliminarProveedor(proveedor.codigo_proveedor)" 
                class="bg-rose-500 hover:bg-rose-600 text-white px-3 py-1.5 rounded text-xs font-medium transition shadow-sm">
                Eliminar
              </button>
              <button [routerLink]="['/actualizar-proveedor', proveedor.codigo_proveedor]" 
                class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded text-xs font-medium transition shadow-sm">
                Actualizar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
