<div class="min-h-screen bg-slate-100 p-8">
  <div class="max-w-xl mx-auto bg-white rounded-xl shadow-lg p-8 border border-slate-200">
    <h1 class="text-2xl font-bold text-slate-900 mb-6 border-b pb-3">Crear Proveedor</h1>

    <!-- Alerta visual condicional con *ngIf para evitar que se muestre como texto plano -->
    <div *ngIf="alertaVisible" class="mb-6 p-4 rounded-lg bg-emerald-50 border border-emerald-300 text-emerald-800 flex justify-between items-center shadow-sm">
      <span class="font-medium">{{ mensajeAlerta }}</span>
      <button (click)="alertaVisible = false" class="text-emerald-700 hover:text-emerald-900 font-bold text-lg px-2">&times;</button>
    </div>

    <form class="space-y-5" (ngSubmit)="guardarproveedor()">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Nombre</label>
        <input
          class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent transition"
          placeholder="Escribir el nombre"
          name="nombre"
          [(ngModel)]="nuevoproveedor.nombre"
          required
        >
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Teléfono</label>
        <input
          class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent transition"
          placeholder="Escribir el teléfono"
          name="telefono"
          [(ngModel)]="nuevoproveedor.telefono"
        >
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Dirección</label>
        <input
          class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent transition"
          placeholder="Escribir la dirección"
          name="direccion"
          [(ngModel)]="nuevoproveedor.direccion"
        >
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">NIT / Código</label>
        <input
          class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent transition"
          placeholder="Escribir el NIT"
          name="nit"
          [(ngModel)]="nuevoproveedor.nit"
        >
      </div>

      <button
        class="w-full rounded-lg bg-slate-900 px-5 py-3 text-white font-medium hover:bg-slate-800 active:bg-slate-950 shadow-md transition duration-200 mt-4"
        type="submit">
        Guardar Proveedor
      </button>
    </form>
  </div>
</div>
