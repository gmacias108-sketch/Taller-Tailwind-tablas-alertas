<div class="max-w-lg mx-auto mt-10">
  <div class="bg-white p-6 rounded-lg shadow-md">

    <h1 class="text-2xl font-bold text-slate-800 mb-6">Crear Cliente</h1>

    <form class="space-y-4" (ngSubmit)="guardarcliente()">

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">NIT</label>
        <input class="w-full rounded-md border-slate-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          placeholder="Escribir el NIT" name="nit" [(ngModel)]="nuevocliente.nit" required>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Nombre</label>
        <input class="w-full rounded-md border-slate-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          placeholder="Escribir el nombre" name="nombre" [(ngModel)]="nuevocliente.nombre" required>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Teléfono</label>
        <input class="w-full rounded-md border-slate-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          placeholder="Escribir el teléfono" name="telefono" [(ngModel)]="nuevocliente.telefono">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Dirección</label>
        <input class="w-full rounded-md border-slate-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          placeholder="Escribir la dirección" name="direccion" [(ngModel)]="nuevocliente.direccion">
      </div>

      <button class="w-full rounded-md bg-slate-900 hover:bg-slate-800 px-4 py-2 text-white font-semibold transition" type="submit">
        Guardar Cliente
      </button>

    </form>
  </div>
</div>
