<h1 class="text-lg font-bold">Actualizar Producto</h1>
<br>

<form (ngSubmit)="actualizarProducto()">
  
  <label>Código:</label><br>
  <input 
    type="number" 
    [(ngModel)]="producto.codigo" 
    name="codigo" 
    required 
    class="border"
  >
  <br><br>

  <label>Descripción:</label><br>
  <input 
    type="text" 
    [(ngModel)]="producto.descripcion" 
    name="descripcion" 
    required 
    class="border"
  >
  <br><br>

  <label>Proveedor:</label><br>
  <input 
    type="text" 
    [(ngModel)]="producto.proveedor" 
    name="proveedor" 
    required 
    class="border"
  >
  <br><br>

  <label>Precio Costo:</label><br>
  <input 
    type="number" 
    [(ngModel)]="producto.precioCosto" 
    name="precioCosto" 
    required 
    class="border"
  >
  <br><br>

  <label>Precio Venta:</label><br>
  <input 
    type="number" 
    [(ngModel)]="producto.precioVenta" 
    name="precioVenta" 
    required 
    class="border"
  >
  <br><br>

  <label>Foto (URL):</label><br>
  <input 
    type="text" 
    [(ngModel)]="producto.foto" 
    name="foto" 
    class="border"
  >
  <br><br>

  <button type="submit" class="bg-gray-200 border px-4 py-1">
    Actualizar
  </button>

</form>
