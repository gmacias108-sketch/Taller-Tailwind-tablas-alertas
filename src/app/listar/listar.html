<h1 class="text-lg font-bold">Lista de Productos</h1>
<br>

<button routerLink="/productos/crear" class="bg-gray-200 border px-3 py-1 mb-3">
  + Nuevo Producto
</button>
<br><br>

<table class="border-collapse border border-gray-400">
  <thead>
    <tr class="bg-gray-100">
      <th class="border border-gray-400 p-2">Código</th>
      <th class="border border-gray-400 p-2">Descripción</th>
      <th class="border border-gray-400 p-2">Proveedor</th>
      <th class="border border-gray-400 p-2">Precio Costo</th>
      <th class="border border-gray-400 p-2">Precio Venta</th>
      <th class="border border-gray-400 p-2">Foto</th>
      <th class="border border-gray-400 p-2">Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of productos">
      <td class="border border-gray-400 p-2">{{ p.codigo }}</td>
      <td class="border border-gray-400 p-2">{{ p.descripcion }}</td>
      <td class="border border-gray-400 p-2">{{ p.proveedor }}</td>
      <td class="border border-gray-400 p-2">{{ p.precioCosto }}</td>
      <td class="border border-gray-400 p-2">{{ p.precioVenta }}</td>
      <td class="border border-gray-400 p-2">{{ p.foto }}</td>
      <td class="border border-gray-400 p-2">
        <button (click)="editarProducto(p)" class="bg-gray-200 border px-2 py-1 mr-1">
          Editar
        </button>
        <button (click)="eliminarProducto(p.codigo)" class="bg-gray-200 border px-2 py-1">
          Eliminar
        </button>
      </td>
    </tr>
  </tbody>
</table>
